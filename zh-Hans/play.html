<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>玩 Pay2Win</title>
  <meta name="description" content="躲开账单、会议，还有周一！打开浏览器就能玩，无需下载或注册。">
  <link rel="alternate" hreflang="en" href="../play.html">
  <link rel="alternate" hreflang="vi" href="../vi/play.html">
  <link rel="alternate" hreflang="ar" href="../ar/play.html">
  <link rel="alternate" hreflang="he" href="../he/play.html">
  <link rel="alternate" hreflang="de" href="../de/play.html">
  <link rel="alternate" hreflang="es" href="../es/play.html">
  <link rel="alternate" hreflang="fr" href="../fr/play.html">
  <link rel="alternate" hreflang="it" href="../it/play.html">
  <link rel="alternate" hreflang="ja" href="../ja/play.html">
  <link rel="alternate" hreflang="ko" href="../ko/play.html">
  <link rel="alternate" hreflang="pl" href="../pl/play.html">
  <link rel="alternate" hreflang="pt-BR" href="../pt-BR/play.html">
  <link rel="alternate" hreflang="ru" href="../ru/play.html">
  <link rel="alternate" hreflang="zh-Hans" href="play.html">
  <link rel="alternate" hreflang="zh-Hant" href="../zh-Hant/play.html">
  <link rel="alternate" hreflang="fa" href="../fa/play.html">
  <link rel="alternate" hreflang="ur" href="../ur/play.html">
  <link rel="alternate" hreflang="ps" href="../ps/play.html">
  <link rel="icon" href="../icon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="stylesheet" href="../play.css?v=20261029-share1">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="游戏区域。拖动角色，躲开飞来的障碍物。"></canvas>

    <div class="hud">
      <div class="hud-row">
        <a class="exit chip-box" href="../" aria-label="退出本局">
          <svg viewBox="0 0 15 15" aria-hidden="true"><path d="M2 2l11 11M13 2L2 13" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
        </a>
        <div class="metric chip-box"><span class="metric-title">最高分</span><span class="metric-value" id="best">0</span></div>
        <select class="language chip-box" id="language" aria-label="语言">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="ar">العربية</option>
          <option value="he">עברית</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="pl">Polski</option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="ru">Русский</option>
          <option value="zh-Hans" selected>简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="fa">فارسی</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </div>
      <div class="score" id="score" aria-hidden="true">0</div>
      <div class="meter" id="health-meter" role="img" aria-label="血量 100，满血 100；体型 1 级，最高 10 级">
        <div class="meter-row"><span>血量 <span id="health">100</span>/100</span><span>体型 1/10</span></div>
        <div class="bar"><span id="health-fill"></span></div>
      </div>
      <div class="state" id="state" aria-live="polite">拖动角色，躲开障碍</div>
    </div>

    <div class="over" id="over" hidden>
      <div class="result" role="status"><h1 id="result-title"></h1><p id="result-score"></p></div>
      <div class="summary">
        <span class="new-best" id="new-best" hidden>破纪录了！</span>
        <p>喘口气，再来一局吧。</p>
      </div>
      <button class="copy-achievement" id="copy-achievement" type="button" aria-live="polite">复制战绩图片</button>
      <button class="restart" id="restart" type="button">↻ 再来一局</button>
    </div>

    <noscript><p class="noscript">请启用 JavaScript 来玩游戏。</p></noscript>
  </main>

  <dialog id="achievement-preview" class="achievement-preview">
    <p>长按图片或用鼠标右键点击图片，然后选择“复制图片”。</p>
    <img id="achievement-image" alt="生存证书">
    <button class="restart" id="close-achievement" type="button">关闭</button>
  </dialog>

  <script>
    window.P2W_STRINGS = {
      lang: "zh-Hans",
      copyImage: "复制战绩图片",
      copied: "图片已复制，可以粘贴了！",
      copyFailed: "图片复制失败，请再试一次。",
      shareCertificate: "生存证书",
      shareCaption: "今天又扛过来了，该你上场了！",
      shareScore: "得分",
      copyHint: "长按图片或用鼠标右键点击图片，然后选择“复制图片”。",
      dragToStart: "拖动角色，躲开障碍",
      dodge: "接着躲！",
      rush: "高峰期来了！",
      calm: "喘口气吧！",
      hurt: "嘶，好疼！还能扛。",
      caughtBy: "没血了！再来一局？",
      caught: "游戏结束",
      scoreFormat: "得分：{score}",
      healthAria: "血量 {hp}，满血 100；体型 1 级，最高 10 级",
      hazards: [
        ["邮件", "light", 68], ["闹钟", "light", 68], ["怕错过", "light", 68],
        ["开会", "medium", 84], ["堵车", "medium", 84], ["周一", "medium", 76], ["账单", "medium", 68],
        ["截止日期", "heavy", 92], ["房租", "heavy", 68], ["自我怀疑", "heavy", 108]
      ]
    };
  </script>
  <script src="../game.js?v=20261103-languages"></script>
</body>
</html>
