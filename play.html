<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play Pay2Win</title>
  <meta name="description" content="Play Pay2Win in your browser: drag to dodge deadlines, bills and Mondays. No download, no account.">
  <link rel="alternate" hreflang="en" href="play.html">
  <link rel="alternate" hreflang="vi" href="vi/play.html">
  <link rel="alternate" hreflang="ar" href="ar/play.html">
  <link rel="alternate" hreflang="he" href="he/play.html">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="play.css">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="Game area. Touch and drag to move your character and dodge flying obstacles."></canvas>

    <div class="hud">
      <div class="hud-row">
        <a class="exit chip-box" href="./" aria-label="Leave run">
          <svg viewBox="0 0 15 15" aria-hidden="true"><path d="M2 2l11 11M13 2L2 13" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
        </a>
        <div class="metric chip-box"><span class="metric-title">BEST</span><span class="metric-value" id="best">0</span></div>
        <select class="language chip-box" id="language" aria-label="Language">
          <option value="en" selected>English</option><option value="vi">Tiếng Việt</option>
          <option value="ar">العربية</option><option value="he">עברית</option>
        </select>
      </div>
      <div class="score" id="score" aria-hidden="true">0</div>
      <div class="meter" id="health-meter" role="img" aria-label="Health 100 of 100, size 1 of 10">
        <div class="meter-row"><span>HP <span id="health">100</span>/100</span><span>SIZE 1/10</span></div>
        <div class="bar"><span id="health-fill"></span></div>
      </div>
      <div class="state" id="state" aria-live="polite">Touch and drag to dodge</div>
    </div>

    <div class="over" id="over" hidden>
      <div class="summary">
        <span class="new-best" id="new-best" hidden>New best!</span>
        <p>Out of health! Take a breath and try again.</p>
      </div>
      <button class="restart" id="restart" type="button">↻ Play again</button>
    </div>

    <noscript><p class="noscript">This game needs JavaScript.</p></noscript>
  </main>

  <script>
    window.P2W_STRINGS = {
      lang: "en",
      dragToStart: "Touch and drag to dodge",
      dodge: "Keep dodging!",
      rush: "Rush hour!",
      calm: "A moment to catch your breath.",
      hurt: "That hurt. Still alive.",
      caughtBy: "Out of health! Try again.",
      caught: "GAME OVER",
      scoreFormat: "Score: {score}",
      healthAria: "Health {hp} of 100, size 1 of 10",
      hazards: [
        ["EMAIL", "light", 68], ["ALARM", "light", 68], ["MISSING OUT", "light", 68],
        ["MEETING", "medium", 84], ["TRAFFIC", "medium", 84], ["MONDAY", "medium", 76], ["BILL", "medium", 68],
        ["DEADLINE", "heavy", 92], ["RENT", "heavy", 68], ["SELF-DOUBT", "heavy", 108]
      ]
    };
  </script>
  <script src="game.js"></script>
</body>
</html>
