<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بازی Pay2Win</title>
  <meta name="description" content="بدون نصب یا حساب کاربری بازی کن. با یه انگشت شخصیتت رو بکش و از قبض و اجاره جاخالی بده.">
  <link rel="alternate" hreflang="en" href="../play.html">
  <link rel="alternate" hreflang="vi" href="../vi/play.html">
  <link rel="alternate" hreflang="ar" href="../ar/play.html">
  <link rel="alternate" hreflang="he" href="../he/play.html">
  <link rel="alternate" hreflang="de" href="../de/play.html">
  <link rel="alternate" hreflang="es" href="../es/play.html">
  <link rel="alternate" hreflang="fr" href="../fr/play.html">
  <link rel="alternate" hreflang="it" href="../it/play.html">
  <link rel="alternate" hreflang="ja" href="../ja/play.html">
  <link rel="alternate" hreflang="ko" href="../ko/play.html">
  <link rel="alternate" hreflang="pl" href="../pl/play.html">
  <link rel="alternate" hreflang="pt-BR" href="../pt-BR/play.html">
  <link rel="alternate" hreflang="ru" href="../ru/play.html">
  <link rel="alternate" hreflang="zh-Hans" href="../zh-Hans/play.html">
  <link rel="alternate" hreflang="zh-Hant" href="../zh-Hant/play.html">
  <link rel="alternate" hreflang="fa" href="play.html">
  <link rel="alternate" hreflang="ur" href="../ur/play.html">
  <link rel="alternate" hreflang="ps" href="../ps/play.html">
  <link rel="icon" href="../icon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="stylesheet" href="../play.css?v=20261029-share1">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="زمین بازی. شخصیتت رو با انگشت بکش و از موانع جاخالی بده."></canvas>
    <div class="hud">
      <div class="hud-row">
        <a class="exit chip-box" href="./" aria-label="خروج از دور">
          <svg viewBox="0 0 15 15" aria-hidden="true"><path d="M2 2l11 11M13 2L2 13" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
        </a>
        <div class="metric chip-box"><span class="metric-title">رکورد</span><span class="metric-value" id="best">0</span></div>
        <select class="language chip-box" id="language" aria-label="زبان">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="ar">العربية</option>
          <option value="he">עברית</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="pl">Polski</option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="ru">Русский</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="fa" selected>فارسی</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </div>
      <div class="score" id="score" aria-hidden="true">0</div>
      <div class="meter" id="health-meter" role="img" aria-label="جون 100 از 100، اندازه 1 از 10">
        <div class="meter-row"><span>جون <bdi dir="ltr"><span id="health">100</span>/100</bdi></span><span>اندازه <bdi dir="ltr">1/10</bdi></span></div>
        <div class="bar"><span id="health-fill"></span></div>
      </div>
      <div class="state" id="state" aria-live="polite">با انگشت بکش و جاخالی بده</div>
    </div>
    <div class="over" id="over" hidden>
      <div class="result" role="status"><h1 id="result-title"></h1><p id="result-score"></p></div>
      <div class="summary">
        <span class="new-best" id="new-best" hidden>رکورد تازه!</span>
        <p>یه نفس بگیر و دوباره امتحان کن.</p>
      </div>
      <button class="copy-achievement" id="copy-achievement" type="button" aria-live="polite">کپی عکس دستاورد</button>
      <button class="restart" id="restart" type="button">↻ دوباره بازی کن</button>
    </div>
    <noscript><p class="noscript">برای بازی، جاوااسکریپت مرورگرت رو روشن کن.</p></noscript>
  </main>
  <dialog id="achievement-preview" class="achievement-preview">
    <p>انگشتت رو روی عکس نگه دار یا روش راست‌کلیک کن و «کپی تصویر» رو بزن.</p>
    <img id="achievement-image" alt="گواهی جان‌به‌دربردن">
    <button class="restart" id="close-achievement" type="button">بستن</button>
  </dialog>

  <script>
    window.P2W_STRINGS = {
      lang: "fa",
      copyImage: "کپی عکس دستاورد",
      copied: "عکس کپی شد! هر جا خواستی بچسبون.",
      copyFailed: "عکس کپی نشد. دوباره امتحان کن.",
      shareCertificate: "گواهی جان‌به‌دربردن",
      shareCaption: "از شلوغی امروز جون سالم به در بردم. نوبت توئه!",
      shareScore: "امتیاز",
      copyHint: "انگشتت رو روی عکس نگه دار یا روش راست‌کلیک کن و «کپی تصویر» رو بزن.",
      dragToStart: "با انگشت بکش و جاخالی بده",
      dodge: "همین‌طور جاخالی بده!",
      rush: "وقت شلوغیه!",
      calm: "نفسی تازه کن!",
      hurt: "آخ! هنوز سر پام.",
      caughtBy: "جونت تموم شد! دوباره امتحان کن.",
      caught: "بازی تموم شد!",
      scoreFormat: "امتیاز: {score}",
      healthAria: "جون {hp} از 100، اندازه 1 از 10",
      hazards: [
        ["ایمیل", "light", 68], ["زنگ ساعت", "light", 68], ["جا موندن", "light", 68],
        ["جلسه", "medium", 84], ["ترافیک", "medium", 84], ["دوشنبه", "medium", 76], ["قبض", "medium", 68],
        ["مهلت", "heavy", 92], ["اجاره", "heavy", 68], ["شک به خود", "heavy", 108]
      ]
    };
  </script>
  <script src="../game.js?v=20261103-languages"></script>
</body>
</html>
