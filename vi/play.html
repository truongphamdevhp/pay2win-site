<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chơi Pay2Win</title>
  <meta name="description" content="Chơi Pay2Win ngay trên trình duyệt: kéo nhân vật để né hạn chót, hóa đơn và thứ Hai. Không cần tải, không cần tài khoản.">
  <link rel="alternate" hreflang="en" href="../play.html">
  <link rel="alternate" hreflang="vi" href="play.html">
  <link rel="alternate" hreflang="ar" href="../ar/play.html">
  <link rel="alternate" hreflang="he" href="../he/play.html">
  <link rel="icon" href="../icon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="stylesheet" href="../play.css?v=20261029-share1">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="Khu vực chơi. Chạm và kéo để di chuyển nhân vật, né các vật cản đang bay tới."></canvas>

    <div class="hud">
      <div class="hud-row">
        <a class="exit chip-box" href="./" aria-label="Rời màn chơi">
          <svg viewBox="0 0 15 15" aria-hidden="true"><path d="M2 2l11 11M13 2L2 13" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
        </a>
        <div class="metric chip-box"><span class="metric-title">KỶ LỤC</span><span class="metric-value" id="best">0</span></div>
        <select class="language chip-box" id="language" aria-label="Ngôn ngữ">
          <option value="en">English</option><option value="vi" selected>Tiếng Việt</option>
          <option value="ar">العربية</option><option value="he">עברית</option>
        </select>
      </div>
      <div class="score" id="score" aria-hidden="true">0</div>
      <div class="meter" id="health-meter" role="img" aria-label="Máu 100 trên 100, kích thước 1 trên 10">
        <div class="meter-row"><span>MÁU <span id="health">100</span>/100</span><span>KÍCH THƯỚC 1/10</span></div>
        <div class="bar"><span id="health-fill"></span></div>
      </div>
      <div class="state" id="state" aria-live="polite">Chạm và kéo để né vật cản</div>
    </div>

    <div class="over" id="over" hidden>
      <div class="result" role="status"><h1 id="result-title"></h1><p id="result-score"></p></div>
      <div class="summary">
        <span class="new-best" id="new-best" hidden>Kỷ lục mới!</span>
        <p>Nghỉ một chút rồi thử lại nhé.</p>
      </div>
      <button class="copy-achievement" id="copy-achievement" type="button" aria-live="polite">Sao chép ảnh thành tích</button>
      <button class="restart" id="restart" type="button">↻ Chơi lại</button>
    </div>

    <noscript><p class="noscript">Game này cần bật JavaScript.</p></noscript>
  </main>

  <dialog id="achievement-preview" class="achievement-preview">
    <p>Nhấn giữ ảnh, hoặc bấm chuột phải, rồi chọn Sao chép hình ảnh.</p>
    <img id="achievement-image" alt="CHỨNG NHẬN SỐNG SÓT">
    <button class="restart" id="close-achievement" type="button">Đóng</button>
  </dialog>

  <script>
    window.P2W_STRINGS = {
      lang: "vi",
      copyImage: "Sao chép ảnh thành tích",
      copied: "Đã chép ảnh! Dán để khoe nhé.",
      copyFailed: "Chưa chép được ảnh. Thử lại nhé.",
      shareCertificate: "CHỨNG NHẬN SỐNG SÓT",
      shareCaption: "Đã sống sót qua bộn bề cuộc đời. Tới lượt bạn!",
      shareScore: "Điểm",
      copyHint: "Nhấn giữ ảnh, hoặc bấm chuột phải, rồi chọn Sao chép hình ảnh.",
      dragToStart: "Chạm và kéo để né vật cản",
      dodge: "Cố lên, né tiếp nào!",
      rush: "Giờ cao điểm!",
      calm: "Tạm yên rồi, thở chút nào!",
      hurt: "Đau đấy! Vẫn trụ được!",
      caughtBy: "Hết máu rồi! Thử lại nhé.",
      caught: "HẾT MÁU RỒI!",
      scoreFormat: "Điểm: {score}",
      healthAria: "Máu {hp} trên 100, kích thước 1 trên 10",
      hazards: [
        ["THƯ ĐẾN", "light", 68], ["BÁO THỨC", "light", 68], ["SỢ BỎ LỠ", "light", 68],
        ["HỌP HÀNH", "medium", 84], ["KẸT XE", "medium", 84], ["THỨ HAI", "medium", 76], ["HÓA ĐƠN", "medium", 68],
        ["HẠN CHÓT", "heavy", 92], ["TIỀN NHÀ", "heavy", 68], ["TỰ TI", "heavy", 108]
      ]
    };
  </script>
  <script src="../game.js?v=20261029-share1"></script>
</body>
</html>
