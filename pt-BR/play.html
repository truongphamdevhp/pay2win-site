<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jogar Pay2Win</title>
  <meta name="description" content="Desvie de prazos, boletos e até da segunda-feira. Jogue no navegador, sem baixar nada nem criar conta.">
  <link rel="alternate" hreflang="en" href="../play.html">
  <link rel="alternate" hreflang="vi" href="../vi/play.html">
  <link rel="alternate" hreflang="ar" href="../ar/play.html">
  <link rel="alternate" hreflang="he" href="../he/play.html">
  <link rel="alternate" hreflang="de" href="../de/play.html">
  <link rel="alternate" hreflang="es" href="../es/play.html">
  <link rel="alternate" hreflang="fr" href="../fr/play.html">
  <link rel="alternate" hreflang="it" href="../it/play.html">
  <link rel="alternate" hreflang="ja" href="../ja/play.html">
  <link rel="alternate" hreflang="ko" href="../ko/play.html">
  <link rel="alternate" hreflang="pl" href="../pl/play.html">
  <link rel="alternate" hreflang="pt-BR" href="play.html">
  <link rel="alternate" hreflang="ru" href="../ru/play.html">
  <link rel="alternate" hreflang="zh-Hans" href="../zh-Hans/play.html">
  <link rel="alternate" hreflang="zh-Hant" href="../zh-Hant/play.html">
  <link rel="alternate" hreflang="fa" href="../fa/play.html">
  <link rel="alternate" hreflang="ur" href="../ur/play.html">
  <link rel="alternate" hreflang="ps" href="../ps/play.html">
  <link rel="icon" href="../icon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="stylesheet" href="../play.css?v=20261029-share1">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="Área de jogo. Arraste o personagem para desviar dos obstáculos."></canvas>

    <div class="hud">
      <div class="hud-row">
        <a class="exit chip-box" href="../" aria-label="Sair da partida">
          <svg viewBox="0 0 15 15" aria-hidden="true"><path d="M2 2l11 11M13 2L2 13" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
        </a>
        <div class="metric chip-box"><span class="metric-title">Recorde</span><span class="metric-value" id="best">0</span></div>
        <select class="language chip-box" id="language" aria-label="Idioma">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="ar">العربية</option>
          <option value="he">עברית</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="pl">Polski</option>
          <option value="pt-BR" selected>Português (Brasil)</option>
          <option value="ru">Русский</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="fa">فارسی</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </div>
      <div class="score" id="score" aria-hidden="true">0</div>
      <div class="meter" id="health-meter" role="img" aria-label="Vida: 100 de 100. Tamanho: 1 de 10.">
        <div class="meter-row"><span>Vida <span id="health">100</span>/100</span><span>Tamanho 1/10</span></div>
        <div class="bar"><span id="health-fill"></span></div>
      </div>
      <div class="state" id="state" aria-live="polite">Arraste o personagem para desviar</div>
    </div>

    <div class="over" id="over" hidden>
      <div class="result" role="status"><h1 id="result-title"></h1><p id="result-score"></p></div>
      <div class="summary">
        <span class="new-best" id="new-best" hidden>Novo recorde!</span>
        <p>Respire fundo e tente mais uma vez.</p>
      </div>
      <button class="copy-achievement" id="copy-achievement" type="button" aria-live="polite">Copiar imagem do resultado</button>
      <button class="restart" id="restart" type="button">↻ Jogar de novo</button>
    </div>

    <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>
  </main>

  <dialog id="achievement-preview" class="achievement-preview">
    <p>Toque na imagem e segure ou clique nela com o botão direito. Depois, escolha Copiar imagem.</p>
    <img id="achievement-image" alt="CERTIFICADO DE SOBREVIVÊNCIA">
    <button class="restart" id="close-achievement" type="button">Fechar</button>
  </dialog>

  <script>
    window.P2W_STRINGS = {
      lang: "pt-BR",
      copyImage: "Copiar imagem do resultado",
      copied: "Imagem copiada! Agora é só colar.",
      copyFailed: "Não deu para copiar a imagem. Tente de novo.",
      shareCertificate: "CERTIFICADO DE SOBREVIVÊNCIA",
      shareCaption: "Sobrevivi à correria do dia a dia. Agora é a sua vez!",
      shareScore: "Pontos",
      copyHint: "Toque na imagem e segure ou clique nela com o botão direito. Depois, escolha Copiar imagem.",
      dragToStart: "Arraste o personagem para desviar",
      dodge: "Continue desviando!",
      rush: "Hora do rush!",
      calm: "Dá pra respirar!",
      hurt: "Doeu, mas você aguentou!",
      caughtBy: "Acabou a vida! Bora tentar de novo?",
      caught: "FIM DE JOGO",
      scoreFormat: "Pontos: {score}",
      healthAria: "Vida: {hp} de 100. Tamanho: 1 de 10.",
      hazards: [
        ["E-MAIL", "light", 68], ["ALARME", "light", 68], ["FOMO", "light", 68],
        ["REUNIÃO", "medium", 84], ["TRÂNSITO", "medium", 84], ["SEGUNDA", "medium", 76], ["BOLETO", "medium", 68],
        ["PRAZO", "heavy", 92], ["Aluguel", "heavy", 68], ["DÚVIDA", "heavy", 108]
      ]
    };
  </script>
  <script src="../game.js?v=20261103-languages"></script>
</body>
</html>
