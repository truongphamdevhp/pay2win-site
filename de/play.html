<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pay2Win spielen</title>
  <meta name="description" content="Weiche Deadlines, Rechnungen und dem Montag aus. Spiel direkt im Browser, ohne Download und ohne Konto.">
  <link rel="alternate" hreflang="en" href="../play.html">
  <link rel="alternate" hreflang="vi" href="../vi/play.html">
  <link rel="alternate" hreflang="ar" href="../ar/play.html">
  <link rel="alternate" hreflang="he" href="../he/play.html">
  <link rel="alternate" hreflang="de" href="play.html">
  <link rel="alternate" hreflang="es" href="../es/play.html">
  <link rel="alternate" hreflang="fr" href="../fr/play.html">
  <link rel="alternate" hreflang="it" href="../it/play.html">
  <link rel="alternate" hreflang="ja" href="../ja/play.html">
  <link rel="alternate" hreflang="ko" href="../ko/play.html">
  <link rel="alternate" hreflang="pl" href="../pl/play.html">
  <link rel="alternate" hreflang="pt-BR" href="../pt-BR/play.html">
  <link rel="alternate" hreflang="ru" href="../ru/play.html">
  <link rel="alternate" hreflang="zh-Hans" href="../zh-Hans/play.html">
  <link rel="alternate" hreflang="zh-Hant" href="../zh-Hant/play.html">
  <link rel="alternate" hreflang="fa" href="../fa/play.html">
  <link rel="alternate" hreflang="ur" href="../ur/play.html">
  <link rel="alternate" hreflang="ps" href="../ps/play.html">
  <link rel="icon" href="../icon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="stylesheet" href="../play.css?v=20261029-share1">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="Spielfeld. Zieh deine Figur mit dem Finger, um den Hindernissen auszuweichen."></canvas>

    <div class="hud">
      <div class="hud-row">
        <a class="exit chip-box" href="../" aria-label="Runde verlassen">
          <svg viewBox="0 0 15 15" aria-hidden="true"><path d="M2 2l11 11M13 2L2 13" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
        </a>
        <div class="metric chip-box"><span class="metric-title">Rekord</span><span class="metric-value" id="best">0</span></div>
        <select class="language chip-box" id="language" aria-label="Sprache">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="ar">العربية</option>
          <option value="he">עברית</option>
          <option value="de" selected>Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="pl">Polski</option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="ru">Русский</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="fa">فارسی</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </div>
      <div class="score" id="score" aria-hidden="true">0</div>
      <div class="meter" id="health-meter" role="img" aria-label="Lebenspunkte 100 von 100, Größe 1 von 10">
        <div class="meter-row"><span>LP <span id="health">100</span>/100</span><span>Größe 1/10</span></div>
        <div class="bar"><span id="health-fill"></span></div>
      </div>
      <div class="state" id="state" aria-live="polite">Zieh deine Figur, um auszuweichen</div>
    </div>

    <div class="over" id="over" hidden>
      <div class="result" role="status"><h1 id="result-title"></h1><p id="result-score"></p></div>
      <div class="summary">
        <span class="new-best" id="new-best" hidden>Neuer Rekord!</span>
        <p>Atme kurz durch und versuch’s noch mal.</p>
      </div>
      <button class="copy-achievement" id="copy-achievement" type="button" aria-live="polite">Rekordbild kopieren</button>
      <button class="restart" id="restart" type="button">↻ Noch mal spielen</button>
    </div>

    <noscript><p class="noscript">Zum Spielen brauchst du JavaScript.</p></noscript>
  </main>

  <dialog id="achievement-preview" class="achievement-preview">
    <p>Halte das Bild gedrückt oder klicke mit der rechten Maustaste darauf und wähle „Bild kopieren“.</p>
    <img id="achievement-image" alt="URKUNDE FÜRS DURCHHALTEN">
    <button class="restart" id="close-achievement" type="button">Schließen</button>
  </dialog>

  <script>
    window.P2W_STRINGS = {
      lang: "de",
      copyImage: "Rekordbild kopieren",
      copied: "Bild kopiert! Du kannst es jetzt einfügen.",
      copyFailed: "Kopieren hat nicht geklappt. Versuch es noch mal.",
      shareCertificate: "URKUNDE FÜRS DURCHHALTEN",
      shareCaption: "Ich hab den Alltagswahnsinn überlebt. Jetzt bist du dran!",
      shareScore: "Punkte",
      copyHint: "Halte das Bild gedrückt oder klicke mit der rechten Maustaste darauf und wähle „Bild kopieren“.",
      dragToStart: "Zieh deine Figur, um auszuweichen",
      dodge: "Immer weiter ausweichen!",
      rush: "Jetzt wird’s eng!",
      calm: "Kurz durchatmen!",
      hurt: "Autsch. Aber du lebst noch.",
      caughtBy: "Keine Leben mehr! Noch eine Runde?",
      caught: "GAME OVER",
      scoreFormat: "Punkte: {score}",
      healthAria: "Lebenspunkte {hp} von 100, Größe 1 von 10",
      hazards: [
        ["E-MAIL", "light", 68], ["WECKER", "light", 68], ["FOMO", "light", 68],
        ["MEETING", "medium", 84], ["STAU", "medium", 84], ["MONTAG", "medium", 76], ["Bitte zahlen", "medium", 68],
        ["DEADLINE", "heavy", 92], ["MIETE", "heavy", 68], ["ZWEIFEL", "heavy", 108]
      ]
    };
  </script>
  <script src="../game.js?v=20261103-languages"></script>
</body>
</html>
